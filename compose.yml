services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hiking_store
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hiking_store_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hiking_store"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hiking_store_pg:
